[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protonet-speaker-app"
version = "0.1.0"
description = "Touchscreen speaker recognition application"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "noisereduce>=3.0,<4",
    "PySide6-Essentials==6.7.3",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
    "torch==2.9.1",
    "torchaudio==2.9.1",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
speaker-app = "speaker_app.main:main"
speaker-password-hash = "speaker_app.password_hash:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["speaker_app*"]

[tool.setuptools.package-data]
speaker_app = ["ui/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
