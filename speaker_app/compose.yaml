services:
  speaker-app:
    profiles: ["raspberry-pi"]
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: protonet-speaker-app:local
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${AUDIO_GID:-29}"
    environment:
      APP_PROFILE: raspberry-pi
      APP_WINDOWED: "false"
      APP_AUDIO_BACKEND: sounddevice
      APP_AUDIO_DEVICE: ${APP_AUDIO_DEVICE:-}
      APP_DATA_DIR: /app/data
      APP_MODEL_DIR: /app/models
      APP_MODEL_PATH: ${APP_MODEL_PATH:-/app/models/ecapa_tdnn_protonet_model.pth}
      APP_MODEL_VERSION: ${APP_MODEL_VERSION:-ecapa-tdnn-protonet-v1}
      APP_INFERENCE_PROVIDER: ${APP_INFERENCE_PROVIDER:-cpu}
      APP_LOG_DIR: /app/logs
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_RECOGNITION_THRESHOLD: ${APP_RECOGNITION_THRESHOLD:-0.70}
      ENROLLMENT_PASSWORD_HASH_FILE: /run/secrets/enrollment_password_hash
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /run/user/host.Xauthority
      QT_X11_NO_MITSHM: "1"
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY_FILE}:/run/user/host.Xauthority:ro
      - ./runtime/data:/app/data
      - ./runtime/logs:/app/logs
      - ../output:/app/models:ro
      - ${HOST_ENROLLMENT_PASSWORD_HASH_FILE}:/run/secrets/enrollment_password_hash:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
